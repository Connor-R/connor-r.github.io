0","0.28","61.0","4.8","-0.8","0.534","-0.037","","","","","","","102.0","","","1.0","0.0","0.0","0.0","","","","","","Team Japan"],["2016","Sean Musser","Number1-mlb","","5.0","","9.0","5.0","0.0","3740.0","","","0.643","0.17","0.0","0.96","83.0","3.2","1.8","0.616","-0.027","","","","","","","107.0","","","0.0","0.0","0.0","0.0","","","","","","the Good the Bad n the Loyd"],["2016","James McKenna","Number1-mlb","","6.0","","7.0","7.0","0.0","3454.5","","","0.5","0.04","0.01","-0.16","44.0","5.8","0.2","0.481","-0.019","","","","","","","99.0","","","0.0","0.0","0.0","0.0","","","","","","Team Fuck You"],["2016","Matt Abraham","Number1-mlb","","7.0","","3.0","11.0","0.0","3483.5","","","0.214","0.04","0.01","-0.05","48.0","5.5","1.5","0.495","0.28","","","","","","","100.0","","","0.0","0.0","0.0","0.0","","","","","","MAN BEAR PUIG"],["2016","Greg Ebert","Number1-mlb","","8.0","","4.0","10.0","0.0","3396.0","","","0.286","0.03","0.02","-0.39","35.0","6.3","1.7","0.453","0.167","","","","","","","97.0","","","0.0","0.0","0.0","0.0","","","","","","Cinnamon Raisin Bagels"],["2016","Kevin Mangan","Number1-mlb","","9.0","","6.0","8.0","0.0","3249.5","","","0.429","0.01","0.11","-0.97","17.0","7.7","1.3","0.383","-0.045","","","","","","","93.0","","","0.0","0.0","0.0","0.0","","","","","","Where my Pitches at?"],["2016","Tyler Edwards","Number1-mlb","","10.0","","6.0","8.0","0.0","2996.5","","","0.429","0.0","0.64","-1.96","2.0","9.9","0.1","0.263","-0.165","","","","","","","86.0","","","0.0","0.0","0.0","1.0","","","","","","Team Scott"]],"links":{},"fallbacks":{},"fallbackText":"search","freeze":2,"colIndex":{"year":0,"owner":1,"league_name":2,"Details":3,"finish":4,"pick":5,"W":6,"L":7,"T":8,"PF":9,"PA":10,"Moves":11,"PtsPct":12,"xTitles":13,"xSackos":14,"PF_z":15,"zStrength":16,"xRank":17,"RankDiff":18,"xPtsPct":19,"PtsPctDiff":20,"PA_z":21,"PA_zStrength":22,"xPA":23,"PA_DIFF":24,"draft_z":25,"draft_zStrength":26,"PF+":27,"PA+":28,"seasons":29,"Playoffs":30,"Podiums":31,"Titles":32,"Sackos":33,"std_finish":34,"total_W":35,"total_L":36,"total_PF":37,"total_PA":38,"team_name":39}}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('table-data').textContent);
var COLS = DATA.cols, ROWS = DATA.rows;
var LINKS = DATA.links || {}, COLIDX_BY_NAME = DATA.colIndex || {};
var FALLBACKS = DATA.fallbacks || {}, FALLBACK_TEXT = DATA.fallbackText || '';
var FREEZE = DATA.freeze || 0;                       // how many leftmost columns stay put
var view = ROWS.map(function(_, i){ return i; });
var sortCol = -1, sortDir = 0;                       // 0 none, 1 asc, -1 desc
var ROWH = 30, PAD = 12;                             // row height px (MEASURED at init), render padding rows
var wrap = document.getElementById('wrap');
var thead = document.getElementById('thead');
var tbody = document.getElementById('tbody');
var topSpace = document.getElementById('topspace');
var botSpace = document.getElementById('botspace');
var count = document.getElementById('count');
// A cell is truncated VISUALLY by css (max-width 520px, ~65 chars) but was
// only made clickable above 120 chars, so anything between was cut off yet
// unexpandable. Mark them expandable well below the visual cutoff and don't
// slice - css adds the ellipsis and the full value stays in the cell.
var EXPAND_AT = 40;

function esc(s){ var d = document.createElement('span'); d.textContent = s; return d.innerHTML; }

// Accent-insensitive matching: "Acuna" finds "Acuña" and "Acuña" finds "Acuna".
// NFD splits an accented letter into base + combining mark, so dropping the
// marks leaves plain ASCII. Every non-ASCII character in this data decomposes
// that way (measured across the spine: only í é á ó ñ ú Á É Ó appear). ⚠️ A
// letter that is its own code point with no combining mark - ø, ł, đ, ß - does
// NOT fold and would need an explicit map if one ever turns up.
function fold(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// The folded whole-row haystack, built ONCE on first use. The plain-text filter
// used to re-join and re-lowercase every row on every keystroke - 24,000 of
// them on the biggest table - and folding is more expensive than lowercasing,
// so caching it makes the filter faster than it was before this change.
var HAYS = null;
function hays(){
  if (!HAYS) HAYS = ROWS.map(function(r){ return fold(r.join('\u0001')); });
  return HAYS;
}

// height must land on the cell too - a <tr> alone doesn't reliably size in
// table layout. rounded to whole px so spacers can never drift fractionally.
function setSpacer(tr, px){
  var h = Math.round(px) + 'px';
  tr.style.height = h;
  tr.firstElementChild.style.height = h;
}

// '' for an ordinary column, else the classes that freeze column i.
function frzClass(i){
  if (i >= FREEZE) return '';
  return 'frz frz-' + i + (i === FREEZE - 1 ? ' frz-last' : '');
}

// ⚠️ THE OFFSETS MUST BE MEASURED, NOT COMPUTED. Column widths come from the
// content (there is no table-layout:fixed), so the left edge of frozen column
// i is the summed rendered width of the columns before it, and that changes
// when a sort or a filter brings a wider cell into view. ⚠️ It also changes
// while SCROLLING, because the virtual scroller only ever has the visible rows
// in the DOM - so this runs at the end of every render, and writes only when a
// value actually moved, to keep it off the hot path.
var frzCache = [];
function measureFrozen(){
  if (!FREEZE || !thead.rows.length) return;
  var cells = thead.rows[0].cells, left = 0;
  for (var i = 0; i < FREEZE && i < cells.length; i++){
    if (frzCache[i] !== left){
      document.documentElement.style.setProperty('--frzL-' + i, left + 'px');
      frzCache[i] = left;
    }
    left += cells[i].offsetWidth;
  }
}

function buildHeader(){
  var tr = document.createElement('tr');
  COLS.forEach(function(c, i){
    var th = document.createElement('th');
    th.innerHTML = esc(c) + '<span class="arrow">' + (i===sortCol ? (sortDir===1?'\u25B2':'\u25BC') : '') + '</span>';
    th.onclick = function(){ setSort(i); };
    if (i < FREEZE) th.className = frzClass(i);
    tr.appendChild(th);
  });
  thead.innerHTML = '';
  thead.appendChild(tr);
}

function numeric(v){
  if (v === '' || v === null) return null;
  var n = parseFloat(String(v).replace(/,/g,''));
  return (!isNaN(n) && isFinite(n) && /^[\s]*[-+$]?[\d,.]+%?[\s]*$/.test(String(v))) ? n : null;
}

function setSort(i){
  if (sortCol === i){ sortDir = (sortDir === 1) ? -1 : 1; } else { sortCol = i; sortDir = 1; }
  view.sort(function(a, b){
    var va = ROWS[a][i], vb = ROWS[b][i];
    var na = numeric(va), nb = numeric(vb);
    var r;
    if (va === '' && vb !== '') return 1;            // empties last, always
    if (vb === '' && va !== '') return -1;
    if (na !== null && nb !== null){ r = na - nb; }
    else { r = String(va).localeCompare(String(vb), undefined, {sensitivity:'base'}); }
    return sortDir * r;
  });
  buildHeader();
  render();
}

var filterBox = document.getElementById('filter');
var debounce = null;
filterBox.addEventListener('input', function(){
  clearTimeout(debounce);
  debounce = setTimeout(applyFilter, 180);
});

// ---- sql-ish WHERE expressions ------------------------------------------
// v_grade >= 7 and area like '%hueco%'   |   year in (2019,2020) or not flash = 'FLASH'
// column names normalize: lowercase, runs of non-alphanumerics -> _
var COLIDX = {};
COLS.forEach(function(c, i){ COLIDX[normId(c)] = i; });

// fold first: without it an accented COLUMN name loses the letter entirely
// (é -> _) and could never be typed. No such column exists today; this just
// keeps column matching on the same footing as value matching.
function normId(s){ return fold(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }

function looksLikeSql(q){
  return /(<=|>=|!=|<>|=|<|>)/.test(q) || /\b(like|in|and|or|not)\b/i.test(q);
}

function tokenize(q){
  var re = /\s*(?:(<=|>=|!=|<>|=|<|>|\(|\)|,)|'((?:[^']|'')*)'|"([^"]*)"|([A-Za-z0-9_.%$-]+))/g;
  var toks = [], m, pos = 0;
  while ((m = re.exec(q)) !== null){
    if (m.index !== pos && q.slice(pos, m.index).trim() !== '') return null;
    pos = re.lastIndex;
    if (m[1] !== undefined) toks.push({t:'op', v:m[1]});
    else if (m[2] !== undefined) toks.push({t:'str', v:m[2].replace(/''/g, "'")});
    else if (m[3] !== undefined) toks.push({t:'str', v:m[3]});
    else {
      var w = m[4], lw = w.toLowerCase();
      if (['and','or','not','like','in'].indexOf(lw) >= 0) toks.push({t:'kw', v:lw});
      else toks.push({t:'word', v:w});
    }
  }
  if (pos < q.length && q.slice(pos).trim() !== '') return null;
  return toks;
}

function parse(toks){
  var p = 0;
  function peek(){ return toks[p]; }
  function take(){ return toks[p++]; }
  function expr(){
    var n = term();
    while (peek() && peek().t === 'kw' && peek().v === 'or'){ take(); n = {or:[n, term()]}; }
    return n;
  }
  function term(){
    var n = factor();
    while (peek() && peek().t === 'kw' && peek().v === 'and'){ take(); n = {and:[n, factor()]}; }
    return n;
  }
  function factor(){
    var tk = peek();
    if (!tk) throw 0;
    if (tk.t === 'kw' && tk.v === 'not'){ take(); return {not: factor()}; }
    if (tk.t === 'op' && tk.v === '('){ take(); var n = expr(); if (!peek() || peek().v !== ')') throw 0; take(); return n; }
    return predicate();
  }
  function predicate(){
    var c = take();
    if (!c || c.t !== 'word') throw 0;
    var idx = COLIDX[normId(c.v)];
    if (idx === undefined) throw 0;
    var neg = false, tk = peek();
    if (tk && tk.t === 'kw' && tk.v === 'not'){ take(); neg = true; tk = peek(); }
    if (!tk) throw 0;
    if (tk.t === 'kw' && tk.v === 'like'){ take(); var v = value(); return {like:{col:idx, pat:v, neg:neg}}; }
    if (tk.t === 'kw' && tk.v === 'in'){
      take(); if (!peek() || peek().v !== '(') throw 0; take();
      var vals = [value()];
      while (peek() && peek().v === ','){ take(); vals.push(value()); }
      if (!peek() || peek().v !== ')') throw 0; take();
      return {inlist:{col:idx, vals:vals, neg:neg}};
    }
    if (neg) throw 0;
    if (tk.t === 'op' && ['=','!=','<>','<','<=','>','>='].indexOf(tk.v) >= 0){ take(); return {cmp:{col:idx, op:tk.v, val:value()}}; }
    throw 0;
  }
  function value(){
    var tk = take();
    if (!tk || (tk.t !== 'str' && tk.t !== 'word')) throw 0;
    return tk.v;
  }
  var n = expr();
  if (p !== toks.length) throw 0;
  return n;
}

function evalNode(n, row){
  if (n.or) return evalNode(n.or[0], row) || evalNode(n.or[1], row);
  if (n.and) return evalNode(n.and[0], row) && evalNode(n.and[1], row);
  if (n.not) return !evalNode(n.not, row);
  if (n.cmp){
    var cell = String(row[n.cmp.col]), val = String(n.cmp.val);
    var nc = numeric(cell), nv = numeric(val), r;
    if (nc !== null && nv !== null){ r = nc < nv ? -1 : (nc > nv ? 1 : 0); }
    else { var a = fold(cell), b = fold(val); r = a < b ? -1 : (a > b ? 1 : 0); }
    switch (n.cmp.op){
      case '=': return r === 0;
      case '!=': case '<>': return r !== 0;
      case '<': return r < 0;
      case '<=': return r <= 0;
      case '>': return r > 0;
      case '>=': return r >= 0;
    }
  }
  if (n.like){
    // fold BEFORE escaping, so % and _ survive to become wildcards
    var pat = fold(n.like.pat).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.');
    var hit = new RegExp('^' + pat + '$', 'i').test(fold(row[n.like.col]));
    return n.like.neg ? !hit : hit;
  }
  if (n.inlist){
    var cell = fold(row[n.inlist.col]);
    var hit = n.inlist.vals.some(function(v){ return fold(v) === cell; });
    return n.inlist.neg ? !hit : hit;
  }
  return false;
}
// -------------------------------------------------------------------------

function applyFilter(){
  var q = filterBox.value.trim();
  filterBox.classList.remove('bad');
  view = [];
  if (q === ''){
    for (var i = 0; i < ROWS.length; i++) view.push(i);
  } else if (looksLikeSql(q)){
    var ast = null, toks = tokenize(q);
    if (toks){ try { ast = parse(toks); } catch (e) { ast = null; } }
    if (!ast){
      filterBox.classList.add('bad');
      count.textContent = 'bad expression';
      return;                                        // keep current view
    }
    for (var i = 0; i < ROWS.length; i++){ if (evalNode(ast, ROWS[i])) view.push(i); }
  } else {
    var terms = fold(q).split(/\s+/), H = hays();
    for (var i = 0; i < ROWS.length; i++){
      var hay = H[i];
      var ok = true;
      for (var t = 0; t < terms.length; t++){ if (hay.indexOf(terms[t]) === -1){ ok = false; break; } }
      if (ok) view.push(i);
    }
  }
  if (sortCol >= 0){ var c = sortCol, d = sortDir; sortCol = -1; sortDir = 0; setSort(c); if (d === -1) setSort(c); return; }
  render();
}

function render(){
  var h = wrap.clientHeight;
  var first = Math.max(0, Math.floor(wrap.scrollTop / ROWH) - PAD);
  var last = Math.min(view.length, Math.ceil((wrap.scrollTop + h) / ROWH) + PAD);
  setSpacer(topSpace, first * ROWH);
  setSpacer(botSpace, (view.length - last) * ROWH);
  var html = [];
  for (var v = first; v < last; v++){
    var row = ROWS[view[v]];
    html.push('<tr>');
    for (var c = 0; c < row.length; c++){
      var val = String(row[c]);
      // an empty cell falls back to its COLUMN~GUARD~template if one is
      // registered AND that row's guard column is non-empty, labelled
      // FALLBACK_TEXT since there is no value to show
      var tmpl = LINKS[c], text = val;
      if (val === ''){
        var fb = FALLBACKS[c];
        tmpl = (fb && String(row[fb[0]] || '') !== '') ? fb[1] : null;
        text = FALLBACK_TEXT;
      }
      var fz = frzClass(c);
      if (tmpl){
        var href = tmpl.replace(/\{([^}]*)\}/g, function(_m, name){
          var raw = (name === '') ? val : String(row[COLIDX_BY_NAME[name]] || '');
          return encodeURIComponent(raw);
        });
        html.push('<td' + (fz ? ' class="' + fz + '"' : '') + '><a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(text) + '</a></td>');
      } else if (val.length > EXPAND_AT){
        html.push('<td class="expandable' + (fz ? ' ' + fz : '') + '" data-r="' + view[v] + '" data-c="' + c + '">' + esc(val) + '</td>');
      } else {
        html.push('<td' + (fz ? ' class="' + fz + '"' : '') + '>' + esc(val) + '</td>');
      }
    }
    html.push('</tr>');
  }
  tbody.innerHTML = html.join('');
  measureFrozen();
  count.textContent = view.length.toLocaleString() + ' of ' + ROWS.length.toLocaleString() + ' rows';
}

// ROWH must match the REAL rendered row height: if it doesn't, the spacer
// heights misreport the total, scrollHeight shifts under the browser on
// every render, it corrects scrollTop, that fires scroll again -> runaway
// scrolling. So measure a real row instead of assuming one.
function calibrate(){
  if (!ROWS.length) return;
  setSpacer(topSpace, 0);
  setSpacer(botSpace, 0);
  var probe = [], row = ROWS[0];
  probe.push('<tr>');
  for (var c = 0; c < row.length; c++){
    var val = String(row[c]);
    probe.push('<td>' + esc(val) + '</td>');
  }
  probe.push('</tr>');
  tbody.innerHTML = probe.join('');
  var tr = tbody.firstElementChild;
  if (tr){
    var h = Math.round(tr.getBoundingClientRect().height);
    if (h > 4) ROWH = h;             // whole px only: fractional rows drift
  }
  tbody.innerHTML = '';
}

// one render per animation frame, no matter how many scroll events arrive
var pending = false;
function scheduleRender(){
  if (pending) return;
  pending = true;
  window.requestAnimationFrame(function(){ pending = false; render(); });
}

wrap.addEventListener('scroll', scheduleRender);
window.addEventListener('resize', function(){ calibrate(); render(); });

var overlay = document.getElementById('overlay');
tbody.addEventListener('click', function(e){
  var td = e.target.closest('td.expandable');
  if (!td) return;
  overlay.querySelector('.box').textContent = ROWS[td.dataset.r][td.dataset.c];
  overlay.style.display = 'flex';
});
overlay.addEventListener('click', function(){ overlay.style.display = 'none'; });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') overlay.style.display = 'none'; });

buildHeader();
calibrate();
render();
