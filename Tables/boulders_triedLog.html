<script id="table-data" type="application/json">{"cols":["Boulder Name","Days Since","Date","Start Time","End Time","Area","Sub Area","V Grade","Return Interest","Session #","Attempts","Minutes","Comment"],"rows":[["Long Haul","178","2026-02-22","13:30:00","15:30:00","Hueco Tanks","East Spur","8.0","4","1","20","120","Didn't figure out I should wear the mantras not solutions until too late and my core was too tired. Sage and I did come up with some very innovative power spotting technique where I lied on his back as he was tabletopping to pull on at a difficult to pull on spot."],["Weiner in a Biner","182","2026-02-18","12:00:00","13:30:00","Hueco Tanks","West Mountain","7.0","2","1","15","90","Never quite figured out non kneebar beta that worked for me."],["S-Curve","185","2026-02-15","10:30:00","11:15:00","Hueco Tanks","East Mountain","6.0","1","1","5","45","Too scary! Sage with the bold ascent."],["M.A.D.D.","185","2026-02-15","15:30:00","15:45:00","Hueco Tanks","East Mountain","9.0","2","1","5","15","Tried with not knowing what this was (next to Top Shelf)."],["Brainless","188","2026-02-12","13:00:00","13:05:00","Hueco Tanks","North Mountain","8.0","1","1","3","5","Holy crap it's scary. Never had the guts to release one of my hands for the jump."],["Groundation","202","2026-01-29","10:30:00","10:50:00","Castle Rock","Cave Rock","7.0","3","3","5","20","Still can't kneebar, but did the first move without it. Then got scared trying the top once and we went elsewhere. Wide Andrew did it which was cool."],["syeK tsoL","244","2025-12-18","11:00:00","11:20:00","Castle Rock","Indian Rock","7.0","2","1","5","20","It's pumpy! Topping out is going to be a pain."],["Across The Tracks","277","2025-11-15","13:00:00","13:45:00","Yosemite","Intersection Boulders","10.0","3","2","5","45","In the rain with Sage, never got the first move and gave up."],["Concrete Crack","326","2025-09-27","17:30:00","17:31:00","Bow Valley","Old Goat","4.0","1","1","1","1","Got scared 2/3 of the way up without a pad and feeling off balance so I climbed down."],["Life of Spice","353","2025-08-31","11:30:00","11:50:00","Tahoe","Beavers","5.0","2","1","3","20","Could not get close"],["Vince's Project","752","2024-07-28","14:45:00","15:05:00","Duncan","Middle Level","9.0","4","1","5","20","Fell a couple times on the bump, but felt doable if fresher. Top felt like it might be sort of hard."],["Noah's Arete","752","2024-07-28","15:15:00","15:30:00","Duncan","Middle Level","7.0","2","1","5","15","Was absolutely toasted and this felt really hard."],["Progression in Backwards Thinking","756","2024-07-24","16:30:00","17:30:00","Squamish","Shannon Falls","10.0","2","1","15","60","Did all the moves individually but couldn't do more than 1 or 2 consecutively. Felt really weak and heavy. I think if I was in better shape I may have been able to do it in one session."],["Panda Milk","759","2024-07-21","11:30:00","11:40:00","Squamish","Furry Creek","2.0","2","1","4","10","Hard, slightly broken, and way too scary on a soli mission"],["Invincible","759","2024-07-21","16:00:00","17:00:00","Squamish","Porteau Cove","10.0","2","1","20","60","So hot, so buggy, so miserable. Got my ass kicked by this, basically successfully only did the two extremely easy moves, though I didn't try anything past the pinch since I couldn't pull on from there. Got close a couple times to getting the pinch, but would probably be stuck doing the next move even if I did. Don't think I have stuff this hard in me in my current state."],["Final Hour","809","2024-06-01","18:00:00","19:00:00","Tahoe","PCT Boulders","7.0","4","1","10","60","Figured it out but was too gassed to do the first move after figuring out the rest. The only cookie diet did not come through."],["Messa delle Streghe","819","2024-05-22","11:30:00","11:40:00","Varazze","Potala","10.0","4","1","3","10","Messed around. Tough to see how it would feel with pads, but I think it would go."],["Rampage","819","2024-05-22","16:00:00","16:30:00","Varazze","Futurama","11.0","2","1","10","30","There were 4 (shitty) stashed pads under it, so I figured I'd at least mess around trying some of the moves. Shockingly they all felt  hard, but most at least felt doable. Linking would be very tough."],["Made in Norway","822","2024-05-19","10:00:00","10:15:00","Chironico","Made in Norway","7.5","3","1","3","15","Felt pretty scared on a left hand bump move. Maybe would feel better with more pads."],["Wonderboy","823","2024-05-18","10:30:00","10:40:00","Magic Wood","Wonderboy","0.0","4","1","3","10","Great warmup to a spooky and weird mantle. Got too spooked!"],["Intermezzo","823","2024-05-18","11:15:00","13:15:00","Magic Wood","Intermezzo","9.0","4","1","10","120","Soooo many people. Maybe like 20 people at the tiny boulder, and maybe 8-10 people trying? Not my favorite experience, but wasn't too bad."],["Bosna Something","823","2024-05-18","15:00:00","15:15:00","Magic Wood","Bosna","8.0","2","1","5","15","Some unknown problem involving grabbing an undercling over your head and pulling it down to your chest. Of course Conor was good at it."],["Mummy","823","2024-05-18","16:00:00","18:00:00","Magic Wood","Morgenlatte","7.5","3","1","20","120","So hard! Should have capitalized the time I did the first move."],["Black Pearl","827","2024-05-14","11:00:00","13:00:00","Brione","Black Pearl","10.0","3","1","20","120","Couldn't do the first move or the move bringing your right hand to the lip, but given the weather it was a relief to just have something dry, and Conor did it to boot. Overall a success."],["Dosage Jump","829","2024-05-12","10:00:00","10:05:00","Brione","Dosage Jump","5.5","4","1","2","5","Whoa. Hit the jug and flew up and over Conor. Great spotting from him and soft dirt prevented an injury after one of the most exciting falls I've ever taken and somehow Caitlin got it on video. I left a nice human sized crater in the dirt. Maybe one day I'll go back and try again."],["Sunny Slab","829","2024-05-12","16:30:00","17:00:00","Brione","Frogger","5.0","2","1","10","30","Damn I want to be better at slab. They always look so fun, but they're always so damn hard."],["There Is No Spoon","830","2024-05-11","16:30:00","18:00:00","Brione","Wie im Urlaub","7.5","3","1","20","90","Such a cool feature, bummed I am not enough of a slab master to finish (must be hard though, Conor also did not finish)."],["Molunk","831","2024-05-10","16:30:00","17:30:00","Brione","Molunk","9.0","4","1","10","60","Felt too hard to do in a single session, but pretty cool! And Conor did it, in a way I would imagine I would not do, but it did look cool."],["Atlantis","831","2024-05-10","18:00:00","18:20:00","Brione","Atlantis","9.0","3","1","5","20","Caitlin believed this would be really easy. It was not. Maybe on another day it would be doable, but certainly not today."],["Solid Works","895","2024-03-07","13:15:00","14:15:00","Doolin","Small Cave","6.0","3","1","10","60","Never figured out how to safely do the top without a pad. Climbing to the lip encounter wasn't too hard."],["Hedgehog","925","2024-02-06","15:00:00","15:45:00","Hueco Tanks","North Mountain","9.0","3","1","8","45","Had a kink in my neck and couldn't really move my head, but still did most of the moves."],["The Egg","927","2024-02-04","15:00:00","15:30:00","Hueco Tanks","East Spur","8.0","3","3","10","30","Did Thegg again! Still cannot do the first move for the life of me...maybe one day."],["Mojo","930","2024-02-01","17:15:00","17:30:00","Hueco Tanks","East Mountain","10.0","4","2","5","15","Did most of the moves...individually. Hoping it feels better not in the sun next time."],["The Egg","934","2024-01-28","13:00:00","14:00:00","Hueco Tanks","East Spur","8.0","3","2","10","60","Still cannot do the first move! But Joaquin did!!"],["Julio and Me","963","2023-12-30","10:30:00","10:35:00","Hueco Tanks","East Mountain","9.0","1","1","3","5","Sharp, probably not that good"],["Squid Pro Roe","963","2023-12-30","15:15:00","15:45:00","Hueco Tanks","East Mountain","9.0","1","1","10","30","Couldnt figure out how to move out right"],["Power of Landjager","964","2023-12-29","16:00:00","16:15:00","Hueco Tanks","East Mountain","11.0","4","1","5","15","Wow that move to the pocket crimp is long and hard...and pogoing after would be hard too. Very cool though!"],["Meddle Detector","964","2023-12-29","16:20:00","16:40:00","Hueco Tanks","West Mountain","6.0","2","1","5","20","One day I will learn how to kneebar! Sage did it and it was really really cool!"],["Crash Dummy","968","2023-12-25","17:15:00","17:25:00","Hueco Tanks","West Mountain","7.0","4","1","3","10","Did all the moves before having to walk out"],["El Techo De Los Tres B","971","2023-12-22","11:00:00","11:05:00","Hueco Tanks","North Mountain","11.0","2","2","2","5","This is...still too hard!!"],["Coffee Achiever","971","2023-12-22","11:30:00","11:35:00","Hueco Tanks","North Mountain","5.0","3","2","2","5","Tried the campus method and felt closer, but it really hurt my scapula so I stopped. Teddy and Conor did it."],["Mr. Serious","973","2023-12-20","14:00:00","14:15:00","Hueco Tanks","East Spur","8.0","2","1","5","15","Felt impossible and unpleasant"],["Sex After Death","973","2023-12-20","15:30:00","16:00:00","Hueco Tanks","East Spur","8.0","4","2","8","30","Got close and then it started raining. It's sharp"],["Triple Cracks","997","2023-11-26","12:00:00","14:00:00","Columbia College","Lower Arboretum","6.0","5","1","20","120","I suck at climbing"],["The Minotaur","998","2023-11-25","16:00:00","17:00:00","Columbia College","The Labyrinth","5.0","4","1","10","60","Too scared"],["Below Me","1327","2022-12-31","11:00:00","12:00:00","Hueco Tanks","East Mountain","8.0","2","1","20","60","Should have done it on my 3rd try, then regressed, then should have done it on my ~10th try before regressing really hard and tearing open my pinky. Was pretty disappointed with my performance, but that's how it goes sometimes."],["Man Gum","1327","2022-12-31","15:00:00","16:00:00","Hueco Tanks","East Mountain","9.0","3","1","15","60","Never did the first move, but did it (to a safe drop off point) from a move in. This is VERY crimpy and sharp. Caitlin could do the first move but not the 3rd(?) move, so combined we had a team send. Conor gave up, but then got bored and gritted his teeth and did it. It still looked hard.\n\nIn lighter news, Casey took my first witnessed Hueco dump. We collected all the plastic bags we could find and off he went, only to return after relieving himself alerting us to the fact that he couldn't find any of the bags other than the bag that the toilet paper was in. He took C^2's saucy sandwich bag for a second layer, and made the (smart) decision to sacrifice his tupperware for extra protection.\n\nWhen we left the area he realized the bags were in his jacket pocket which he had removed prior to pooping. A comedy in three parts."],["Bad Religion","1332","2022-12-26","11:00:00","11:01:00","Hueco Tanks","East Spur","8.0","2","1","1","1","Tried once and got two (2) flappers! So I stopped trying. Caitlin did it though! And Joaquin did New Religion and Sage got very close!"],["The Dwindles","1333","2022-12-25","14:00:00","15:00:00","Hueco Tanks","North Mountain","9.0","2","1","15","60","I bet this would be WAY easier with a kneebar. Too bad we didn't have a kneebar pad, nor am I able to competently kneebar."],["The Egg","1333","2022-12-25","16:00:00","17:00:00","Hueco Tanks","East Spur","8.0","3","1","10","60","Couldn't do the knee bar to pull off the ground but did the rest of the problem. The top is super cool."],["Slim Pickins","1335","2022-12-23","10:30:00","10:35:00","Hueco Tanks","East Spur","5.0","3","1","2","5","Sooooo cold. Friction felt great, but every time I fell I'd kick the wall and it would hurt super bad. Conor repeated and Casey did it!"],["Choir Boys","1337","2022-12-21","14:00:00","14:20:00","Hueco Tanks","North Mountain","7.0","2","2","5","20","Still really hard. Mostly tried out of boredom and to give some sick support to Caitlin."],["Bloody Flapper","1337","2022-12-21","16:00:00","16:15:00","Hueco Tanks","North Mountain","4.0","4","2","5","15","Doesn't feel good on the knee but I'd like to do it. I'm bad at jumping."],["William's Jump","1338","2022-12-20","14:00:00","14:10:00","Hueco Tanks","East Mountain","3.0","5","3","5","10","Did not feel good on the knee."],["The Bear","1338","2022-12-20","15:00:00","15:15:00","Hueco Tanks","East Mountain","4.0","4","3","5","15","Couldn't figure out how to get off the ground. After watching Louie's video it turned out we were starting in the wrong place."],["Houdini","1466","2022-08-14","15:15:00","16:45:00","Squamish","North Walls","8.0","5","1","15","90","Got all the moves, just didn't have the juice to finish it off. Hopefully will come back tomorrow before heading out and can get it done."],["Superdyke","1466","2022-08-14","18:30:00","19:00:00","Squamish","Grand Wall","3.0","4","3","5","30","God damn this is so hard. Guess this will have to wait for another year...."],["Superdyke","1469","2022-08-11","19:30:00","20:45:00","Squamish","Grand Wall","3.0","5","2","10","75","Will I ever do this? Doubt it. Banged into the tree chimney a few times decently hard. Piano matching is so hard."],["The Perfect Cave","1472","2022-08-08","8:45:00","9:45:00","Squamish","North Walls","11.0","3","5","15","60","Tried to wake up early and get better temperature; results very meh. Forgot I don't operate well this early, plus I'm tired, so this was pretty useless. Still did the top a couple of times because I'm loving that part, just that damn bump (and today the move before the bump). At least the forest is very pleasant and still at this hour!"],["The Perfect Cave","1473","2022-08-07","9:30:00","11:30:00","Squamish","North Walls","11.0","3","4","25","120","Pretty depressing to keep walking back up here to fall at the same spot over and over. Kind of fully starting to lose motivation. At least the cave is usually much cooler than the rest of the forest so the temperature is pleasant. "],["The Perfect Cave","1474","2022-08-06","13:00:00","15:30:00","Squamish","North Walls","11.0","4","3","20","150","Another long session of falling on basically the same two moves. Managed to do the bump a couple times in isolation, but VERY low percentage. Came close to doing the bump once from the bottom (but not really even that close, just sorta wildly slapped the crimp with my feet coming off)."],["Almost Famous","1474","2022-08-06","17:15:00","17:30:00","Squamish","North Walls","9.0","2","1","5","15","Did not feel very good on any of those holds. Maybe a heat thing? Skin thing? Weakness thing?"],["Sheriff's Badge Arete","1474","2022-08-06","17:45:00","17:55:00","Squamish","North Walls","9.0","2","1","3","10","Oof so hard. Pulled on 3 times. Foot popped 3 times. Knee scraped 3 times. Awkward and balancey to reach up to that gastony arete. Looks very cool though wish I could do it."],["The Perfect Cave","1476","2022-08-04","17:00:00","20:00:00","Squamish","North Walls","11.0","4","2","45","180","Maybe the longest I sat at a boulder, got the top super dialed (brought the Futuras, which work much better than the barefoot method). Just need to link the move to the lip and the first bump. Really hoping I only have to do that once and will finish it off once that happens."],["Megalodon","1476","2022-08-04","20:30:00","20:31:00","Squamish","North Walls","5.0","3","1","1","1","Probably wouldn't feel too bad with an extra pad or two and/or a spotter. But solo with 1.5 pads is too scary for me."],["The Perfect Cave","1477","2022-08-03","12:00:00","14:30:00","Squamish","North Walls","11.0","4","1","30","150","Whoa! Did much better than expected. Did every move but the first bump (this has gotta be the crux right? Not the move to the jug?) and was semi-close on that a couple times. No left shoe for the heel hook, kind of crazy but the Solutions just have way too insensitive of a heel for that for me."],["Power Launch","1477","2022-08-03","14:45:00","15:30:00","Squamish","North Walls","8.0","5","1","15","45","Started to rain lightly but the top hold stayed pretty dry so it was okay. What wasn't okay was how much I needed to poop. Each time I jumped I was slightly afraid a little poo would come out (none did, I made it home in time)."],["Peter and the Wolf","1479","2022-08-01","18:00:00","18:30:00","Squamish","Shannon Falls","9.0","4","1","10","30","The crux move is so hard! Reach for an undercling crimp thing above your head. Wish it was not so hot and humid when I tried this so I would know whether or not it was actually possible. Would love to be able to do this someday though, even if the approach isn't my favorite."],["Whispering Waters","1480","2022-07-31","21:30:00","23:00:00","Squamish","North Walls","6.0","4","1","10","90","After doing Flow Stone and checking this out this morning, I went home and watched some videos of this to gauge whether it would be worth going back to. After sitting around for a few hours the weather had cooled down I couldn't think of anything else to do so I drove back out there to give it some goes. It was decently scary trying to figure out the mid/top section with 2 pads, but almost doable. However it was pretty sharp, and harder than I thought, so overall a 2.5/5 experience. Would consider going back, but probably not solo."],["The 'I'","1482","2022-07-29","15:00:00","15:15:00","Squamish","North Walls","6.0","4","1","5","15","Couldn't hold onto a single hold really."],["Majestic","1485","2022-07-26","17:00:00","19:00:00","Squamish","Brittania Beach","6.0","5","1","3","120","So fun, wish I could have done it, if only it wasn't soooo crowded."],["The Weasel","1486","2022-07-25","18:00:00","18:15:00","Squamish","Grand Wall","8.0","2","1","5","15","Did the first move once. Did no other moves. Felt impossible (possibly heat? But also just very hard and anti-style)"],["Astroman","1488","2022-07-23","15:45:00","16:00:00","Squamish","North Walls","7.0","5","1","4","15","Matching the lip hurt my wrist. Will have to go back in a week or so when it feels better hopefully and finish it off."],["Lounge Act","1489","2022-07-22","19:30:00","20:15:00","Squamish","Grand Wall","6.0","5","3","10","45","Got all the moves at the end of the day. Not enough skin/energy/strength to put it all together, but it's possible which I wasn't sure about before!"],["Phantom Menace","1491","2022-07-20","14:00:00","15:00:00","Squamish","Paradise Valley","6.0","5","4","10","60","I am starting to think I will never ever do this. It's so hard. I've never gotten more than ~18 inches of the ground. Felt kind of close once though, but then I dry fired bad and my fingies stung for like 20 minutes."],["Planet of the Apes","1492","2022-07-19","14:00:00","14:30:00","Squamish","North Walls","8.0","2","1","10","30","Never got off the ground really. The foot is very high and I am not good at that. I'm not good at much in climbing these days, but this is certainly near the top of the list."],["Sage Against the Machine","1492","2022-07-19","15:30:00","16:30:00","Squamish","North Walls","7.0","3","1","10","60","Heel the arete to reach back far right, would really like another 4 inches of wingspan."],["The Land That Time Forgot","1497","2022-07-14","16:00:00","17:00:00","Squamish","North Walls","6.0","3","2","15","60","I suck at this. The other beta is easily but much less pleasant so I'll stick with the original."],["The Land That Time Forgot","1500","2022-07-11","18:00:00","18:45:00","Squamish","North Walls","6.0","3","1","15","45","Eh, maybe I'll stay on the wall one day. Maybe not."],["Lowlife","1502","2022-07-09","20:00:00","21:00:00","Squamish","Grand Wall","10.0","2","1","20","60","Better conditions, but waaaay worse skin. I think the skin/fatigue canceled out the cooler weather. This one might just have to wait. It kind of feels likeThe Fury, it's just a game of chance (aka I'm not strong enough to do it super clean, so I just have to get lucky once)."],["Lowlife","1503","2022-07-08","18:00:00","19:00:00","Squamish","North Walls","10.0","4","1","15","60","Did each move individually. Did not do them together. Very hot and sweaty. Lots of dirtbikers going mach dick past, was kind of afraid a rock would kick up and kill me."],["The Peach","1503","2022-07-08","19:15:00","20:00:00","Squamish","North Walls","7.0","2","1","10","45","Absolute insanity. Could barely get off the ground, never latched the second hold, never even managed to try the fun dyno. Maybe it'll be better when it's less hot and humid."],["Smooth Move","1633","2022-02-28","12:00:00","12:30:00","Hueco Tanks","North Mountain","5.5","4","3","10","30","Damn. Thought today was the day but wasn't meant to be. Even tried a basketball shoe for extra jumping, but that just made it harder. Maybe I was never as close as I thought..."],["Eurydice","1633","2022-02-28","13:00:00","13:45:00","Hueco Tanks","North Mountain","9.0","3","2","10","45","Well I did what I thought was the crux, and then had no idea what to do after so I guess that's something. Maybe wearing shoes that had a more precise heel could have been helpful, but who knows."],["Predator","1637","2022-02-24","12:00:00","13:00:00","Hueco Tanks","North Mountain","10.0","3","2","10","60","I thought this innovative heel beta I saw a video on was going to be the difference. It wasn't. Underclings are still way too hard. My down jacket did blow away in a strong gust of wind though so that added some excitement. I think a gust whipped through the cave and rocketed out; my jacket flew up and out of the cave, probably like 40-70 feet up in the air. I thought I was going to have to spend the rest of the day looking for it, but luckily I found it after maybe 25 (stressful) minutes. It had blown maybe ~250 feet east and I audibly shrieked when I found it. Probably happier to find the jacket than to do any climb, so I'll take it."],["Dirty Martini on the Rocks","1637","2022-02-24","14:30:00","15:15:00","Hueco Tanks","North Mountain","9.0","5","1","5","45","Was joined by a large crew (Jeff and 4 of his friends). The number of pads helped, but my index fingers were pretty tender from Predator I think? DFinally did the first move but felt a little tweak so called it good for the day. \"I know we just met, but you need to set higher goals for yourself.\" Thank you random *EXTREMELY* strong girl, I think that's a pretty good assessment of my goal setting mentality."],["Eurydice","1639","2022-02-22","12:30:00","12:45:00","Hueco Tanks","North Mountain","9.0","2","1","5","15","Did not make a lot of progress, but did crumble a foothold."],["Smooth Move","1639","2022-02-22","15:00:00","16:15:00","Hueco Tanks","North Mountain","5.5","5","2","25","75","I WANT TO DO THIS SO BAD. WHY IS JUMPING SO HARD."],["El Techo De Los Tres B","1639","2022-02-22","16:30:00","17:00:00","Hueco Tanks","North Mountain","11.0","3","1","10","30","Tried out some of the moves, but realized I had neither the skin nor the energy to do much more than that."],["Predator","1641","2022-02-20","12:00:00","12:30:00","Hueco Tanks","North Mountain","10.0","3","1","10","30","Couldn't figure out how to do the punchy undercling move, felt really far."],["Governator","1641","2022-02-20","12:45:00","13:15:00","Hueco Tanks","North Mountain","10.0","2","1","10","30","Sunny and lot, the first crimp (not very sharp) started to give me a split. Also felt pretty hard."],["Assisted Living","1641","2022-02-20","14:30:00","15:30:00","Hueco Tanks","North Mountain","8.0","5","1","5","60","Ran into Matt and new friend Jeff and gave it a couple tries with them. Try 1: should have flashed, but did not think about how to do topout. Try 22: did top section in isolation (not very hard). Then I sat around and ate and when I tried again I felt like jello and could not do the second move. Returning home I've realized that I think we were using bad beta (no high right heel for second move). Maybe it will feel even easier with that method when I go back."],["Both Barrels","1641","2022-02-20","16:15:00","17:15:00","Hueco Tanks","North Mountain","9.0","3","1","10","60","It's a 3 move problem and I've done 0 moves (maybe am close on the first 2?), but it's kind of fun and interesting!"],["Speed Bump","1644","2022-02-17","13:00:00","14:30:00","Hueco Tanks","North Mountain","7.0","4","3","20","90","Okay, new beta again, use TWO kneebars. Should have done it once but punted the top. Should have taken shoes off so I could feel the heel. Also maybe practice the top?"],["Power of Silence","1644","2022-02-17","16:00:00","16:30:00","Hueco Tanks","North Mountain","10.0","1","1","5","30","Out of my league for sure."],["Diaphanous Sea","1644","2022-02-17","16:45:00","17:30:00","Hueco Tanks","North Mountain","11.0","1","1","10","45","Maaaaybe would be doable with good skin and a lot of work, but probably best to wait. Tried the top finishing V4 problem briefly too and it was a bit sharp/stabby/not super fun; I feel bad for anybody who falls there after doing the bottom."],["The Bear","1648","2022-02-13","14:00:00","14:30:00","Hueco Tanks","East Mountain","4.0","4","2","5","30","The second move is the hardest single move in all of rock climbing."],["William's Jump","1648","2022-02-13","14:20:00","15:00:00","Hueco Tanks","East Mountain","3.0","5","2","20","40","I GOT CLOSE! Very exciting! Beta: One step runup (accuracy more important than power), jump off right foot."],["Speed Bump","1651","2022-02-10","15:45:00","16:45:00","Hueco Tanks","North Mountain","7.0","3","2","10","60","Maybe got better knee bar beta this time to skip the hold our right? Felt harder than last time maybe."],["See Sharp","1651","2022-02-10","17:00:00","17:10:00","Hueco Tanks","North Mountain","6.0","3","2","3","10","Guess what? This still felt sharp, but at least I didn't decapitate my finger this time. Maybe it'll feel better some time when it's colder."],["Shamu","1654","2022-02-07","13:30:00","13:45:00","Hueco Tanks","North Mountain","9.0","2","1","5","15","Have no idea how to go right hand to the crimp ¯\\_(?)_/¯"],["Free Willy","1656","2022-02-05","16:00:00","17:00:00","Hueco Tanks","North Mountain","10.0","5","3","10","60","Worked out the intermediate beta, which will work way better than the jump beta for me."],["Bloody Flapper","1656","2022-02-05","17:30:00","17:40:00","Hueco Tanks","North Mountain","4.0","3","1","5","10","Really did not want to dyno, kept trying a myriad of other/worse options. Next time I should just jump."],["Smooth Move","1660","2022-02-01","14:30:00","15:00:00","Hueco Tanks","North Mountain","5.5","5","1","10","30","Fuck I want to be able to dyno so bad. Why are the most fun looking climbs dynos and flatwalls, two things I suck at? Slapped ~3 inches before the jug once. Key beta, wear tennis shoes (easier to jump in/more comfortable to land on)."],["Coffee Achiever","1660","2022-02-01","17:30:00","17:45:00","Hueco Tanks","North Mountain","5.0","3","1","5","15","What in the fuck?! This feels so hard. Got absolutely no where. According to Stupid Strong Southern Sean, this thing is just super hard."],["Mojo","1663","2022-01-29","11:00:00","11:30:00","Hueco Tanks","East Mountain","10.0","4","1","5","30","Would have liked to feel how the 2nd and 3rd holds feel without tape on my critical fingers. Still may be too hard for my current strength level."],["The Notorious D.I.G.","1663","2022-01-29","15:30:00","16:00:00","Hueco Tanks","East Mountain","9.0","2","2","5","30","Didn't make any more progress, and I still don't want to hold that sharp hold. Probably out of my league for now."],["The Bear","1663","2022-01-29","17:00:00","17:30:00","Hueco Tanks","East Mountain","4.0","3","1","10","30","Juuuuuust spanny enough to make that second move blind and quite hard. Tried Casey's right method once but the foot felt even higher and balancey."],["Pumped Full of Semen","1666","2022-01-26","13:00:00","13:30:00","Hueco Tanks","North Mountain","8.0","4","1","10","30","Tried while Vanessa did Daily Dick Dose. Did all the moves but didn't finish yet."],["Speed Bump","1666","2022-01-26","15:00:00","15:45:00","Hueco Tanks","North Mountain","7.0","3","1","10","45","Did all the moves but didn't finish yet. Using a knee pad will be very helpfu."],["See Sharp","1666","2022-01-26","17:00:00","17:15:00","Hueco Tanks","North Mountain","6.0","3","1","3","15","Almost flashed, but got tunnel finish and thrutched for the top, slicing open my middle finger. Tried to do it with tape but was too painful."],["Full Service","1669","2022-01-23","13:00:00","14:00:00","Hueco Tanks","East Mountain","10.0","3","1","10","60","Upon returning home I was informed that matching the loaf was bad beta by the stupidly strong man with questionable sequencing. Instead, you should flip the J."],["The Notorious D.I.G.","1669","2022-01-23","15:00:00","16:00:00","Hueco Tanks","East Mountain","9.0","3","1","10","60","Very sharp, made me not want to try to hold the pocket, but at least it was a little separated from the rest of the tour."],["Collins Problem","1918","2021-05-19","11:30:00","12:00:00","Castle Rock","Parking Lot Rock","10.0","3","3","10","30","Felt really slippery even though it was super cold. Also realized it's not over after the first move, matching or getting your foot up to go left is going to be hard as well."],["Crossroads Moe","1922","2021-05-15","13:00:00","14:00:00","Yosemite","Bridalveil Falls","6.0","4","1","15","60","Hooooly mosquitos. Couldn't see the top hold because of sun, think it will go next time."],["The Wave","1922","2021-05-15","16:00:00","16:45:00","Yosemite","The Wave","3.0","3","1","5","45","Too scary for a little boy like me! Sage put on his big boy pants"],["Collins Problem","1934","2021-05-03","11:30:00","12:30:00","Castle Rock","Parking Lot Rock","10.0","3","2","10","60","Slapped the hold a couple times before busting off and opening my knuckle. I don't think I can do this in the hot weather."],["Collins Problem","1946","2021-04-21","12:00:00","12:30:00","Castle Rock","Parking Lot Rock","10.0","4","1","15","30","Slapped the hold once surprisingly. Had taken a couple months off climbing but surprisingly felt okay on crimps and skin didn't hurt too bad. Who knows why."],["The Brute","2009","2021-02-17","12:10:00","13:40:00","Santa Barbara","Potter's Point","9.0","4","1","15","90","Need to work on that crimp lock-off strength. Slapped the second hold a number of times, but never with enough control to stay on."],["Ecoterrorist","2022","2021-02-04","14:00:00","15:00:00","Castle Rock","The Graveyard","10.0","2","1","10","60","Man...I didn't expect this to be as spooky as it was. I don't know if the new landing zone makes it better or worse, but the tree is  really bothersome to me. I did the first move a couple times, but haven't quite figured out the match. I tried starting from both hands on the lip off the tree, but couldn't commit to doing any moves even with the tree padded up. Maybe this one will have to wait until I'm waaaay stronger or something."],["Static Reach Sit","2025","2021-02-01","11:00:00","11:20:00","Castle Rock","Indian Rock","10.0","1","1","10","20","Super spanny...not sure if I have the reach, or if I just need to be real strong. Also I tried the normal start a couple times and have 0 idea how I did it whenever that was."],["Right Hand Indian Man","2025","2021-02-01","12:30:00","13:00:00","Castle Rock","Indian Rock","7.0","3","2","10","30","Still don't really know how the hell to do this...At least I did *one* move this time. No idea how to get out of the full span after the first move."],["Trojan Arete","2036","2021-01-21","11:30:00","12:15:00","Santa Barbara","Painted Cave","8.0","4","1","10","45","Got basically to the rock scar, and then decided it was not an ideal time to try due to traffic/0 spotters. I was pleasantly surprised how nicely the bottom section climbs."],["Steve's Traverse","2036","2021-01-21","12:30:00","13:30:00","Santa Barbara","Painted Cave","9.0","4","1","10","60","Got all the moves up until the upper section of Big Deal (felt lazy, didn't want to set up pads), despite feeling very sore and my skin hurting from not climbing, so that was a very pleasant surprise! Maybe I'm not as weak as I thought (though I'm sure linking them all together and then doing the upper part of Big Deal is going to be harder than I anticipate)."],["Sasquatch","2037","2021-01-20","15:00:00","15:05:00","Santa Barbara","The Brickyard","5.0","3","1","2","5","Too scared to do the topout section without a spotter or more pads. I'm not out here to get hurt!"],["Dancing Outlaw","2037","2021-01-20","15:15:00","16:15:00","Santa Barbara","The Brickyard","8.0","4","1","10","60","Once again, too scared to do the topout section without a spotter or way more pads. Made it to the first sloper on the lip (supposedly crux), but getting to the second sloper seemed like it had higher backsplat-on-to-rock potential than what I was hoping for."],["Grotesque Old Woman Sit","2037","2021-01-20","17:00:00","17:10:00","Santa Barbara","The Brickyard","10.0","4","1","5","10","Tried pulling on a few times and slapped the first move but couldn't keep my feet. Then realized that my skin hurt real bad and didn't want to grab more crimps."],["Kauk Roof","2043","2021-01-14","13:30:00","14:30:00","Castle Rock","Magoos","7.0","2","1","15","60","Maybe not the best solo boulder? Kept falling and ending up on the ground. Plus I couldn't really figure out wtf to do after getting the crimp."],["Swinger","2067","2020-12-21","13:05:00","13:10:00","Castle Rock","Aquarian Valley","5.0","1","1","5","5","Very confusing, not sure how the hell to levitate off the ground."],["Pitbull","2077","2020-12-11","13:30:00","13:50:00","Castle Rock","Yabo Zone","8.0","4","1","10","20","Never stuck the first move but was getting closer. Then it started to rain. Also maybe the first time I've gotten use out of a kneebar?! Might even be *easier* with a kneepad?!"],["Biddles Steel","2133","2020-10-16","11:00:00","11:20:00","Castle R <script>
'use strict';
var DATA = JSON.parse(document.getElementById('table-data').textContent);
var COLS = DATA.cols, ROWS = DATA.rows;
var LINKS = DATA.links || {}, COLIDX_BY_NAME = DATA.colIndex || {};
var FALLBACKS = DATA.fallbacks || {}, FALLBACK_TEXT = DATA.fallbackText || '';
var FREEZE = DATA.freeze || 0;                       // how many leftmost columns stay put
var view = ROWS.map(function(_, i){ return i; });
var sortCol = -1, sortDir = 0;                       // 0 none, 1 asc, -1 desc
var ROWH = 30, PAD = 12;                             // row height px (MEASURED at init), render padding rows
var wrap = document.getElementById('wrap');
var thead = document.getElementById('thead');
var tbody = document.getElementById('tbody');
var topSpace = document.getElementById('topspace');
var botSpace = document.getElementById('botspace');
var count = document.getElementById('count');
// A cell is truncated VISUALLY by css (max-width 520px, ~65 chars) but was
// only made clickable above 120 chars, so anything between was cut off yet
// unexpandable. Mark them expandable well below the visual cutoff and don't
// slice - css adds the ellipsis and the full value stays in the cell.
var EXPAND_AT = 40;

function esc(s){ var d = document.createElement('span'); d.textContent = s; return d.innerHTML; }

// Accent-insensitive matching: "Acuna" finds "Acuña" and "Acuña" finds "Acuna".
// NFD splits an accented letter into base + combining mark, so dropping the
// marks leaves plain ASCII. Every non-ASCII character in this data decomposes
// that way (measured across the spine: only í é á ó ñ ú Á É Ó appear). ⚠️ A
// letter that is its own code point with no combining mark - ø, ł, đ, ß - does
// NOT fold and would need an explicit map if one ever turns up.
function fold(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// The folded whole-row haystack, built ONCE on first use. The plain-text filter
// used to re-join and re-lowercase every row on every keystroke - 24,000 of
// them on the biggest table - and folding is more expensive than lowercasing,
// so caching it makes the filter faster than it was before this change.
var HAYS = null;
function hays(){
  if (!HAYS) HAYS = ROWS.map(function(r){ return fold(r.join('\u0001')); });
  return HAYS;
}

// height must land on the cell too - a <tr> alone doesn't reliably size in
// table layout. rounded to whole px so spacers can never drift fractionally.
function setSpacer(tr, px){
  var h = Math.round(px) + 'px';
  tr.style.height = h;
  tr.firstElementChild.style.height = h;
}

// '' for an ordinary column, else the classes that freeze column i.
function frzClass(i){
  if (i >= FREEZE) return '';
  return 'frz frz-' + i + (i === FREEZE - 1 ? ' frz-last' : '');
}

// ⚠️ THE OFFSETS MUST BE MEASURED, NOT COMPUTED. Column widths come from the
// content (there is no table-layout:fixed), so the left edge of frozen column
// i is the summed rendered width of the columns before it, and that changes
// when a sort or a filter brings a wider cell into view. ⚠️ It also changes
// while SCROLLING, because the virtual scroller only ever has the visible rows
// in the DOM - so this runs at the end of every render, and writes only when a
// value actually moved, to keep it off the hot path.
var frzCache = [];
function measureFrozen(){
  if (!FREEZE || !thead.rows.length) return;
  var cells = thead.rows[0].cells, left = 0;
  for (var i = 0; i < FREEZE && i < cells.length; i++){
    if (frzCache[i] !== left){
      document.documentElement.style.setProperty('--frzL-' + i, left + 'px');
      frzCache[i] = left;
    }
    left += cells[i].offsetWidth;
  }
}

function buildHeader(){
  var tr = document.createElement('tr');
  COLS.forEach(function(c, i){
    var th = document.createElement('th');
    th.innerHTML = esc(c) + '<span class="arrow">' + (i===sortCol ? (sortDir===1?'\u25B2':'\u25BC') : '') + '</span>';
    th.onclick = function(){ setSort(i); };
    if (i < FREEZE) th.className = frzClass(i);
    tr.appendChild(th);
  });
  thead.innerHTML = '';
  thead.appendChild(tr);
}

function numeric(v){
  if (v === '' || v === null) return null;
  var n = parseFloat(String(v).replace(/,/g,''));
  return (!isNaN(n) && isFinite(n) && /^[\s]*[-+$]?[\d,.]+%?[\s]*$/.test(String(v))) ? n : null;
}

function setSort(i){
  if (sortCol === i){ sortDir = (sortDir === 1) ? -1 : 1; } else { sortCol = i; sortDir = 1; }
  view.sort(function(a, b){
    var va = ROWS[a][i], vb = ROWS[b][i];
    var na = numeric(va), nb = numeric(vb);
    var r;
    if (va === '' && vb !== '') return 1;            // empties last, always
    if (vb === '' && va !== '') return -1;
    if (na !== null && nb !== null){ r = na - nb; }
    else { r = String(va).localeCompare(String(vb), undefined, {sensitivity:'base'}); }
    return sortDir * r;
  });
  buildHeader();
  render();
}

var filterBox = document.getElementById('filter');
var debounce = null;
filterBox.addEventListener('input', function(){
  clearTimeout(debounce);
  debounce = setTimeout(applyFilter, 180);
});

// ---- sql-ish WHERE expressions ------------------------------------------
// v_grade >= 7 and area like '%hueco%'   |   year in (2019,2020) or not flash = 'FLASH'
// column names normalize: lowercase, runs of non-alphanumerics -> _
var COLIDX = {};
COLS.forEach(function(c, i){ COLIDX[normId(c)] = i; });

// fold first: without it an accented COLUMN name loses the letter entirely
// (é -> _) and could never be typed. No such column exists today; this just
// keeps column matching on the same footing as value matching.
function normId(s){ return fold(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }

function looksLikeSql(q){
  return /(<=|>=|!=|<>|=|<|>)/.test(q) || /\b(like|in|and|or|not)\b/i.test(q);
}

function tokenize(q){
  var re = /\s*(?:(<=|>=|!=|<>|=|<|>|\(|\)|,)|'((?:[^']|'')*)'|"([^"]*)"|([A-Za-z0-9_.%$-]+))/g;
  var toks = [], m, pos = 0;
  while ((m = re.exec(q)) !== null){
    if (m.index !== pos && q.slice(pos, m.index).trim() !== '') return null;
    pos = re.lastIndex;
    if (m[1] !== undefined) toks.push({t:'op', v:m[1]});
    else if (m[2] !== undefined) toks.push({t:'str', v:m[2].replace(/''/g, "'")});
    else if (m[3] !== undefined) toks.push({t:'str', v:m[3]});
    else {
      var w = m[4], lw = w.toLowerCase();
      if (['and','or','not','like','in'].indexOf(lw) >= 0) toks.push({t:'kw', v:lw});
      else toks.push({t:'word', v:w});
    }
  }
  if (pos < q.length && q.slice(pos).trim() !== '') return null;
  return toks;
}

function parse(toks){
  var p = 0;
  function peek(){ return toks[p]; }
  function take(){ return toks[p++]; }
  function expr(){
    var n = term();
    while (peek() && peek().t === 'kw' && peek().v === 'or'){ take(); n = {or:[n, term()]}; }
    return n;
  }
  function term(){
    var n = factor();
    while (peek() && peek().t === 'kw' && peek().v === 'and'){ take(); n = {and:[n, factor()]}; }
    return n;
  }
  function factor(){
    var tk = peek();
    if (!tk) throw 0;
    if (tk.t === 'kw' && tk.v === 'not'){ take(); return {not: factor()}; }
    if (tk.t === 'op' && tk.v === '('){ take(); var n = expr(); if (!peek() || peek().v !== ')') throw 0; take(); return n; }
    return predicate();
  }
  function predicate(){
    var c = take();
    if (!c || c.t !== 'word') throw 0;
    var idx = COLIDX[normId(c.v)];
    if (idx === undefined) throw 0;
    var neg = false, tk = peek();
    if (tk && tk.t === 'kw' && tk.v === 'not'){ take(); neg = true; tk = peek(); }
    if (!tk) throw 0;
    if (tk.t === 'kw' && tk.v === 'like'){ take(); var v = value(); return {like:{col:idx, pat:v, neg:neg}}; }
    if (tk.t === 'kw' && tk.v === 'in'){
      take(); if (!peek() || peek().v !== '(') throw 0; take();
      var vals = [value()];
      while (peek() && peek().v === ','){ take(); vals.push(value()); }
      if (!peek() || peek().v !== ')') throw 0; take();
      return {inlist:{col:idx, vals:vals, neg:neg}};
    }
    if (neg) throw 0;
    if (tk.t === 'op' && ['=','!=','<>','<','<=','>','>='].indexOf(tk.v) >= 0){ take(); return {cmp:{col:idx, op:tk.v, val:value()}}; }
    throw 0;
  }
  function value(){
    var tk = take();
    if (!tk || (tk.t !== 'str' && tk.t !== 'word')) throw 0;
    return tk.v;
  }
  var n = expr();
  if (p !== toks.length) throw 0;
  return n;
}

function evalNode(n, row){
  if (n.or) return evalNode(n.or[0], row) || evalNode(n.or[1], row);
  if (n.and) return evalNode(n.and[0], row) && evalNode(n.and[1], row);
  if (n.not) return !evalNode(n.not, row);
  if (n.cmp){
    var cell = String(row[n.cmp.col]), val = String(n.cmp.val);
    var nc = numeric(cell), nv = numeric(val), r;
    if (nc !== null && nv !== null){ r = nc < nv ? -1 : (nc > nv ? 1 : 0); }
    else { var a = fold(cell), b = fold(val); r = a < b ? -1 : (a > b ? 1 : 0); }
    switch (n.cmp.op){
      case '=': return r === 0;
      case '!=': case '<>': return r !== 0;
      case '<': return r < 0;
      case '<=': return r <= 0;
      case '>': return r > 0;
      case '>=': return r >= 0;
    }
  }
  if (n.like){
    // fold BEFORE escaping, so % and _ survive to become wildcards
    var pat = fold(n.like.pat).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.');
    var hit = new RegExp('^' + pat + '$', 'i').test(fold(row[n.like.col]));
    return n.like.neg ? !hit : hit;
  }
  if (n.inlist){
    var cell = fold(row[n.inlist.col]);
    var hit = n.inlist.vals.some(function(v){ return fold(v) === cell; });
    return n.inlist.neg ? !hit : hit;
  }
  return false;
}
// -------------------------------------------------------------------------

function applyFilter(){
  var q = filterBox.value.trim();
  filterBox.classList.remove('bad');
  view = [];
  if (q === ''){
    for (var i = 0; i < ROWS.length; i++) view.push(i);
  } else if (looksLikeSql(q)){
    var ast = null, toks = tokenize(q);
    if (toks){ try { ast = parse(toks); } catch (e) { ast = null; } }
    if (!ast){
      filterBox.classList.add('bad');
      count.textContent = 'bad expression';
      return;                                        // keep current view
    }
    for (var i = 0; i < ROWS.length; i++){ if (evalNode(ast, ROWS[i])) view.push(i); }
  } else {
    var terms = fold(q).split(/\s+/), H = hays();
    for (var i = 0; i < ROWS.length; i++){
      var hay = H[i];
      var ok = true;
      for (var t = 0; t < terms.length; t++){ if (hay.indexOf(terms[t]) === -1){ ok = false; break; } }
      if (ok) view.push(i);
    }
  }
  if (sortCol >= 0){ var c = sortCol, d = sortDir; sortCol = -1; sortDir = 0; setSort(c); if (d === -1) setSort(c); return; }
  render();
}

function render(){
  var h = wrap.clientHeight;
  var first = Math.max(0, Math.floor(wrap.scrollTop / ROWH) - PAD);
  var last = Math.min(view.length, Math.ceil((wrap.scrollTop + h) / ROWH) + PAD);
  setSpacer(topSpace, first * ROWH);
  setSpacer(botSpace, (view.length - last) * ROWH);
  var html = [];
  for (var v = first; v < last; v++){
    var row = ROWS[view[v]];
    html.push('<tr>');
    for (var c = 0; c < row.length; c++){
      var val = String(row[c]);
      // an empty cell falls back to its COLUMN~GUARD~template if one is
      // registered AND that row's guard column is non-empty, labelled
      // FALLBACK_TEXT since there is no value to show
      var tmpl = LINKS[c], text = val;
      if (val === ''){
        var fb = FALLBACKS[c];
        tmpl = (fb && String(row[fb[0]] || '') !== '') ? fb[1] : null;
        text = FALLBACK_TEXT;
      }
      var fz = frzClass(c);
      if (tmpl){
        var href = tmpl.replace(/\{([^}]*)\}/g, function(_m, name){
          var raw = (name === '') ? val : String(row[COLIDX_BY_NAME[name]] || '');
          return encodeURIComponent(raw);
        });
        html.push('<td' + (fz ? ' class="' + fz + '"' : '') + '><a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(text) + '</a></td>');
      } else if (val.length > EXPAND_AT){
        html.push('<td class="expandable' + (fz ? ' ' + fz : '') + '" data-r="' + view[v] + '" data-c="' + c + '">' + esc(val) + '</td>');
      } else {
        html.push('<td' + (fz ? ' class="' + fz + '"' : '') + '>' + esc(val) + '</td>');
      }
    }
    html.push('</tr>');
  }
  tbody.innerHTML = html.join('');
  measureFrozen();
  count.textContent = view.length.toLocaleString() + ' of ' + ROWS.length.toLocaleString() + ' rows';
}

// ROWH must match the REAL rendered row height: if it doesn't, the spacer
// heights misreport the total, scrollHeight shifts under the browser on
// every render, it corrects scrollTop, that fires scroll again -> runaway
// scrolling. So measure a real row instead of assuming one.
function calibrate(){
  if (!ROWS.length) return;
  setSpacer(topSpace, 0);
  setSpacer(botSpace, 0);
  var probe = [], row = ROWS[0];
  probe.push('<tr>');
  for (var c = 0; c < row.length; c++){
    var val = String(row[c]);
    probe.push('<td>' + esc(val) + '</td>');
  }
  probe.push('</tr>');
  tbody.innerHTML = probe.join('');
  var tr = tbody.firstElementChild;
  if (tr){
    var h = Math.round(tr.getBoundingClientRect().height);
    if (h > 4) ROWH = h;             // whole px only: fractional rows drift
  }
  tbody.innerHTML = '';
}

// one render per animation frame, no matter how many scroll events arrive
var pending = false;
function scheduleRender(){
  if (pending) return;
  pending = true;
  window.requestAnimationFrame(function(){ pending = false; render(); });
}

wrap.addEventListener('scroll', scheduleRender);
window.addEventListener('resize', function(){ calibrate(); render(); });

var overlay = document.getElementById('overlay');
tbody.addEventListener('click', function(e){
  var td = e.target.closest('td.expandable');
  if (!td) return;
  overlay.querySelector('.box').textContent = ROWS[td.dataset.r][td.dataset.c];
  overlay.style.display = 'flex';
});
overlay.addEventListener('click', function(){ overlay.style.display = 'none'; });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') overlay.style.display = 'none'; });

buildHeader();
calibrate();
render();
</script>
</body>
</html>
